[project]
name = "viadmin"
version = "0.1.0"
description = "ViAdminShift: a benchmark of LLM knowledge of Vietnam's 2025 provincial and ward restructuring, with its data build, evaluation and analysis code"
readme = "README.md"
authors = [
    { name = "Phan Binh Nguyen Lam", email = "lamtercqh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "torch==2.13.0",
    "tqdm>=4.70.1",
    "transformers>=5.10.4,<5.18",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.31.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
